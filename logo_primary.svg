<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A7AE4"/>
      <stop offset="100%" stop-color="#1B4F8A"/>
    </linearGradient>
  </defs>
  <!-- Logomark: 3 ascending bars forming an abstract estrado/podium + data/AI motif -->
  <rect x="12" y="52" width="10" height="28" rx="2" fill="#0D2B4E"/>
  <rect x="26" y="38" width="10" height="42" rx="2" fill="#143D6B"/>
  <rect x="40" y="22" width="10" height="58" rx="2" fill="#1B5191"/>
  <!-- Connecting node dot (AI accent) -->
  <circle cx="55" cy="16" r="5" fill="url(#accent)"/>
  <line x1="45" y1="22" x2="52" y2="18" stroke="#2A7AE4" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="72" y="58" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="600" letter-spacing="-1" fill="#0D2B4E">Estrado</text>
  <text x="280" y="58" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="300" letter-spacing="-0.5" fill="#2A7AE4">AI</text>
  <!-- Tagline -->
  <text x="72" y="78" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#6B8299" text-transform="uppercase">INTELIGENCIA ARTIFICIAL PARA LA DEFENSA PENAL</text>
</svg>